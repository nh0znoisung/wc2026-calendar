name: Sync World Cup 2026 to Google Calendar

on:
  schedule:
    # Mỗi 5 phút (mức nhỏ nhất GitHub cho phép). GitHub cron có thể trễ vài phút
    # khi hệ thống bận — bình thường.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # cho phép bấm chạy tay trong tab Actions
  push:
    branches: [main]       # chạy lại mỗi khi sửa code

permissions:
  contents: read

concurrency:
  group: sync-gcal
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GCAL_ID: ${{ secrets.GCAL_ID }}
      GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
      FAVORITE_TEAMS: ${{ vars.FAVORITE_TEAMS }}   # repo Variable (không phải secret); trống thì dùng mặc định
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests google-api-python-client google-auth

      - name: Fetch fixtures data (openfootball)
        run: git clone --depth 1 https://github.com/openfootball/worldcup.git _data

      - name: Sync to Google Calendar
        if: ${{ env.GCAL_ID != '' && env.GOOGLE_SA_KEY != '' }}
        run: |
          DATA=$(echo _data/2026--*)
          python sync_gcal.py --data-dir "$DATA"

      - name: Warn if secrets missing
        if: ${{ env.GCAL_ID == '' || env.GOOGLE_SA_KEY == '' }}
        run: echo "::warning::GCAL_ID / GOOGLE_SA_KEY chưa cấu hình — bỏ qua sync. Xem README mục Mode B."
